name: selftest

# Runs tateru's own checks: the git hooks, the Claude hooks and the scripts.
# Same script you can run locally: bash .claude/scripts/selftest.sh

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and sqlite3 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck sqlite3
      # macOS ships sqlite3. Windows runs without either, which is how most
      # Git Bash users run it too; selftest says which checks it skipped.
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Self-test
        run: bash .claude/scripts/selftest.sh
