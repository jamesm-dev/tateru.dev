name: selftest

# Runs tateru's own checks: the git hooks, the Claude hooks and the scripts.
# Same script you can run locally: bash .claude/scripts/selftest.sh

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Linux is the gate. macOS (bash 3.2) and Windows (Git Bash, CRLF) report
    # platform drift without blocking, until they have been green for a while.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and sqlite3
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck sqlite3
      - name: Self-test
        run: bash .claude/scripts/selftest.sh
